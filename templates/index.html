<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAN Bus Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            background-color: #fff;
            overflow: hidden;
            width: 100vw;
            position: relative;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 30px;
            box-sizing: border-box;
            max-height: 100vh;
            width: 875px;
            height: 612px;
            margin: 140px auto 0;
            position: relative;
        }
        
        body::before {
            content: "";
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 120%;
            height: 180%;
            border-radius: 100% 100% 75% 75%;
            background-color:#2c2c2c;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
        }

        .dashboard {
            margin: 0 auto;
            background-image: url('{{ url_for('static', filename='images/DASHBOARD.png') }}');

            background-size: contain;
            background-repeat: no-repeat;
            width: 800px;
            height: 400px;
            position: relative;
            background-position: bottom center;
            z-index: 100;
        }

        #screen {
            width: 200px;
            height: 94px;
            background-color: rgba(61, 61, 61, 0.5);
            position: absolute;
            bottom: 21%;
            left: 49%;
            transform: translateX(-50%);
            color: rgb(204, 87, 32);
            padding: 10px 7px;
            font-size: 18px;
        }

        #screen div {
            margin-bottom: 7px;
            ;
        }

        #screen #screen-text {
            margin-bottom: 14px;
        }

        #default-text {
            margin-top: auto;
            font-size: 16px;
        }

        #time {
            margin-top: auto;
            font-size: 16px;
        }

        .button-group {
            width: 797px;
            position: relative;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            position: relative;
            z-index: 200;
            left: -5px;
            margin-top: 125px;
            transform: rotate(1.5deg);
        }



        .buttons-left {
            width: 104px;
            display: flex;
            overflow: hidden;
            border-radius: 40px 13px 13px 13px;
            flex-wrap: wrap;
        }

        .buttons-left button {
            width: 50px;
            height: 67px;
            border: none;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            outline: none;
            background-color: rgb(167, 166, 166);
            /* Metal look gradient */
            background: linear-gradient(145deg, rgb(115 115 115), rgb(167, 166, 166) 50%, rgb(167, 166, 166) 50%, rgb(115 115 115));
        }
        

        .buttons-left button svg {
            width: 18px;
            height: 18px;
            fill: #000;
            stroke: #000;
        }

        .buttons-right {
            width: 104px;
            display: flex;
            flex-wrap: wrap;
            overflow: hidden;
                        border-radius: 13px 30px 13px 13px;
        }

        .buttons-right button {
            width: 50px;
            height: 67px;
            border: none;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            outline: none;
            margin: 1px;
            background-color: rgb(167, 166, 166);
            /* Metal look gradient */
            background: linear-gradient(145deg, rgb(115 115 115), rgb(167, 166, 166) 50%, rgb(167, 166, 166) 50%, rgb(115 115 115));
        }

        .buttons-right button svg {
            width: 19px;
            height: 19px;
            fill: #000;
            stroke: #000;
        }

        .buttons-left button.clicked,
        .buttons-right button.clicked {
            filter: blur(2px);
        }

        .wheel {
            width: 1080px;
            height: 300px;
            position: relative;
            margin-top: -50px;
            display: flex;
            justify-content: space-between;
            padding: 20px;
            margin: -130px auto 0;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            left: 50%;
            transform: translateX(-50%);
            align-items: center;
            z-index: 200;
        }

        .wheel img {
            width: 100%;
            height: auto;
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.0/socket.io.js"></script>
    <script>

	var socket = io.connect();

        socket.on('connect', function() {
            console.log('connected');
            });
        
        socket.on('new_message', function (data) {
            mesg = data.message;
            mesg = mesg.replace("instrument panel: ", "");
            document.getElementById('screen-text').innerText = mesg;
        });

        
        function sendCanMessage(buttonMask) {
            fetch(`/send/${buttonMask}`)
                .then(response => response.text())
                .then(data => console.log(data))
                .catch(error => console.error('Error:', error));
        }
        
        </script>
  
</head>

<body>
    <div class="dashboard">
        <div id="screen">
            <div id="screen-text"><!-- show decoded messages here --></div>
            <div id="default-text">162.204</div>
            <div id="screen-bottom">
                <div id="time">
                    <span id="hours">00</span>:<span id="minutes">00</span>
                </div>
            </div>
        </div>
    </div>
